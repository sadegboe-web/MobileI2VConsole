name: Deploy Chromebook Video Studio
on:
  push:
    branches: [main]
    paths:
      - 'chromebook-app/**'
      - '.github/workflows/deploy-chromebook-app.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: chromebook-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4