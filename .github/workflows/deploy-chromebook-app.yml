name: Build Chromebook Video Studio
on:
  push:
    branches: [main]
    paths:
      - 'chromebook-app/**'
      - '.github/workflows/deploy-chromebook-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package browser app
        run: cd chromebook-app && zip -r ../Chromebook-Video-Studio.zip .
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: Chromebook-Video-Studio
          path: Chromebook-Video-Studio.zip
          retention-days: 14