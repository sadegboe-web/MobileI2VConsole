
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore project
        run: dotnet restore src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Build APK
        run: dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o ./apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-APK
          path: apk-output/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
