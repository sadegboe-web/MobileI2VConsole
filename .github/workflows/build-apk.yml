name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore project
        run: dotnet restore src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Configure persistent signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/mobilei2v-release.keystore", $bytes)

      - name: Build signed APK with persistent key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$env:GITHUB_WORKSPACE/mobilei2v-release.keystore" -p:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS" -p:AndroidSigningKeyPass="$env:ANDROID_KEY_PASSWORD" -p:AndroidSigningStorePass="$env:ANDROID_KEYSTORE_PASSWORD" -o ./apk-output

      - name: Build APK (temporary default signing)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o ./apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-APK
          path: apk-output/**/*.apk
          if-no-files-found: error
          retention-days: 7
